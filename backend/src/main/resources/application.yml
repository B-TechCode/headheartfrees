spring:
  application:
    name: headheartfrees-backend

  # Phase 4 adds the first table, so the application now requires Postgres to
  # start. Before this phase it booted with no database at all; that is no
  # longer true, and `docker compose up` is the simplest way to run it.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/headheartfrees}
    username: ${SPRING_DATASOURCE_USERNAME:headheartfrees}
    password: ${SPRING_DATASOURCE_PASSWORD:headheartfrees}

  jpa:
    # Flyway owns the schema. Hibernate only checks that its mapping matches
    # what the migrations produced, and refuses to start if it does not.
    hibernate:
      ddl-auto: validate
    # Sessions do not stay open into view rendering; this is a JSON API.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Google sign-in is deliberately NOT declared here.
  #
  # Spring Boot validates every declared registration and rejects an empty
  # client-id outright, so a block with `${GOOGLE_CLIENT_ID:}` would stop the
  # application booting whenever Google is unconfigured - taking password login
  # down with it. The registration is injected at startup, and only when both
  # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set, by
  # GoogleOAuth2EnvironmentPostProcessor. See OAuth2AbsentConfigIT.
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    # Errors are rendered by the application's own handler, in the shape
    # documented in PROJECT_BRIEF.md section 6. Never leak internals.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  # Filtered by Maven at build time from the project version.
  version: @project.version@
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Peers allowed to speak for a client behind them via X-Forwarded-For.
  #
  # EMPTY BY DEFAULT, and that is the safe direction. Behind a reverse proxy,
  # set this to that proxy's address so per-user limits work; leave it empty and
  # everyone behind the proxy shares one bucket. Trusting the header without
  # naming the proxy would let any caller bypass the limiter entirely by varying
  # it, so this is never a wildcard. See ClientAddressResolver.
  rate-limit:
    trusted-proxies: ${APP_RATE_LIMIT_TRUSTED_PROXIES:}
  auth:
    # Development default so a fresh clone and the test suite both work. It is
    # long enough for HS256, so nothing downstream rejects it — which is why an
    # install that forgets APP_JWT_SECRET used to start happily on a secret that
    # is public in this repository, and why JwtSecretGuard now refuses to start
    # on this exact value unless the `local` profile is active. Change it here
    # and JwtSecretGuardTest fails until the guard's copy is changed too.
    jwt-secret: ${APP_JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQtbm90LWZvci1hbnl0aGluZy1yZWFsLTAxMjM0NTY3ODk=}
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:P30D}
    # Browsers treat localhost as a secure context, so Secure cookies work over
    # plain HTTP there. Set false only for a LAN-IP deployment without TLS.
    cookie-secure: ${APP_COOKIE_SECURE:true}
    # Comma-separated. Promotes accounts that ALREADY EXIST to ADMIN at startup;
    # never creates one. Register first, set this, restart.
    admin-bootstrap-emails: ${APP_ADMIN_BOOTSTRAP_EMAILS:}
    oauth2-success-redirect: ${APP_OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/auth/callback}

# Swagger UI and the OpenAPI JSON are OFF by default, and are re-enabled only
# by the `local` profile (application-local.yml).
#
# They are a map of every endpoint, its request shape and its validation rules,
# served to anyone who asks. That is a developer convenience in development and
# free reconnaissance in production, and the application warned about it on
# every startup until phase 9.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method

# Actuator: expose nothing.
#
# The health endpoint this project actually uses is /api/v1/health, a
# hand-written controller with a fixed body. Actuator's own endpoints are not
# needed, and `env`, `configprops` and `heapdump` in particular would publish
# configuration - including which secrets are set - to whoever reaches them.
management:
  endpoints:
    web:
      exposure:
        include: ""
  endpoint:
    health:
      enabled: false

logging:
  level:
    root: INFO
    com.headheartfrees: INFO
    # Rule 2.1: never turn these up in an environment that serves real people.
    # DEBUG on the web layer logs request bodies, and while the vent endpoint's
    # body is only ever a mood enum, the habit is what matters — the moment
    # another endpoint carries something sensitive, this setting is what decides
    # whether it lands in a log file.
    org.springframework.web: INFO
