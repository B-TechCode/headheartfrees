name: headheartfrees

# Every value falls back to a local-development default, so `docker compose up`
# works on a fresh clone with no .env file. Copy .env.example to .env to override.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headheartfrees}
      POSTGRES_USER: ${POSTGRES_USER:-headheartfrees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-headheartfrees}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-headheartfrees} -d ${POSTGRES_DB:-headheartfrees}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      BACKEND_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # The datasource is not wired up until phase 4; `db` is already here so the
      # topology does not change when it is.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/headheartfrees}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-headheartfrees}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-headheartfrees}
      # Auth - phase 5. These were documented in .env.example and read by the
      # application from the day the phase landed, but never listed here, so
      # nothing running under compose could set them: the backend used
      # application.yml's defaults whatever .env said, and Google sign-in was
      # unreachable because the client id never reached the container.
      #
      # APP_JWT_SECRET is the null form on purpose, not ${APP_JWT_SECRET:-}.
      # An unset variable interpolates to the empty string, and an empty string
      # is a *set* property as far as Spring is concerned - it would override
      # the default in application.yml and the application would refuse to
      # start with "app.auth.jwt-secret is not set". The null form passes the
      # value through from .env or the shell and leaves the variable absent
      # when there is none, which is what keeps a fresh clone working.
      APP_JWT_SECRET:
      APP_JWT_ACCESS_TOKEN_TTL: ${APP_JWT_ACCESS_TOKEN_TTL:-PT15M}
      APP_JWT_REFRESH_TOKEN_TTL: ${APP_JWT_REFRESH_TOKEN_TTL:-P30D}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_ADMIN_BOOTSTRAP_EMAILS: ${APP_ADMIN_BOOTSTRAP_EMAILS:-}
      # Both must default to empty. Google is optional: blank means the
      # registration is never created and the app starts with password login
      # only, which is the state OAuth2AbsentConfigIT pins.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_OAUTH2_SUCCESS_REDIRECT: ${APP_OAUTH2_SUCCESS_REDIRECT:-http://localhost:3000/auth/callback}
      # Phase 9. Peers allowed to speak for a client via X-Forwarded-For.
      # Empty by default, which means the header is never honoured and every
      # caller behind the Docker gateway shares one rate-limit bucket. That is
      # the safe failure; trusting the header from anyone removes the limiter.
      APP_RATE_LIMIT_TRUSTED_PROXIES: ${APP_RATE_LIMIT_TRUSTED_PROXIES:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time. Changing it requires
        # `docker compose build frontend`, not just a restart.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        # Must agree with GOOGLE_CLIENT_ID above. The backend decides whether
        # Google works; this only decides whether the button is drawn, and the
        # two are separate settings because there is no endpoint yet that lets
        # the frontend ask. Also build-time - a restart will not change it.
        NEXT_PUBLIC_GOOGLE_SIGN_IN: ${NEXT_PUBLIC_GOOGLE_SIGN_IN:-false}
        # Phase 9. Both are BUILD time: Next resolves headers() when it builds,
        # so changing either needs `docker compose build frontend`.
        #
        # CSP_REPORT_ONLY sends the policy as report-only, which logs
        # violations without blocking. For verifying a policy change against a
        # real browser; never true in a deployed build.
        CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
        # HSTS. Off here and off in every local run - the header must never be
        # sent over plain HTTP. Its primary home is the TLS terminator.
        ENABLE_HSTS: ${ENABLE_HSTS:-false}
    environment:
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
